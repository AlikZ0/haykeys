name: Build HayKeys IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: haykeys-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Download source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check core behavior
        run: bash scripts/test_core.sh

      - name: Build unsigned iPhone IPA
        run: bash scripts/build_unsigned_ipa.sh "$GITHUB_WORKSPACE/artifacts"

      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: HayKeys-unsigned-IPA
          path: |
            artifacts/HayKeys-unsigned.ipa
            artifacts/HayKeys-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 3
